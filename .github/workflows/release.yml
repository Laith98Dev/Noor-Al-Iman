# Builds the Android APK and creates a DRAFT GitHub release when a version tag is pushed.
# Usage:  git tag v1.0.0 && git push origin v1.0.0
name: Build & Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # we need this to create the release

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }} # e.g. https://api.example.com/api
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }} # optional (for a signed release)
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Set up release signing (only if the keystore secret exists)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS

      - name: Build APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "noor-al-iman-${GITHUB_REF_NAME}.apk"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: "Noor Al-Iman ${{ github.ref_name }}"
          files: app/noor-al-iman-${{ github.ref_name }}.apk
